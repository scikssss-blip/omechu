function mergeStatic() {
  scene.updateMatrixWorld(true);
  const groups = new Map(), drop = [];
  scene.traverse(o => { if (!o.isMesh || o.userData.keep) return; const m = o.material; if (!groups.has(m)) groups.set(m, []); groups.get(m).push(o); });
  for (const [m, list] of groups) {
    if (list.length < 2) continue;
    let n = 0; const parts = list.map(o => { const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone()); g.applyMatrix4(o.matrixWorld); n += g.attributes.position.count; return g; });
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2); let k = 0;
    for (const g of parts) { const c = g.attributes.position.count; pos.set(g.attributes.position.array, k * 3); if (g.attributes.normal) nor.set(g.attributes.normal.array, k * 3); if (g.attributes.uv) uv.set(g.attributes.uv.array, k * 2); k += c; g.dispose(); }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.computeBoundingSphere(); const big = new THREE.Mesh(geo, m); big.matrixAutoUpdate = false; scene.add(big);
    for (const o of list) drop.push(o);
  }
  for (const o of drop) { o.parent && o.parent.remove(o); o.geometry.dispose(); }
}

// 진행자는 제한 시간 뒤에 결과를 내고, 나머지는 진행자가 나가 버렸는지 지켜봄

  log.push({ sys: true, text: tables[t].solo ? TH.solo + '에 앉았어요. 소리를 켜고 천천히 쉬어가세요.' : `${tables[t].name}에 앉았어요. 대화는 같은 테이블 사람에게만 보여요.` });

}

function tableAt(x, z) {

    if (tb.bar ? (Math.abs(x) < 5.2 && z < -4.1 && z > -6.8) : tb.solo ? (x > HW - 2.3 && x < HW + 0.4 && z > -7.8 && z < 6.4) : Math.hypot(x - tb.x, z - tb.z) < tb.r + 0.5) return t; }

let moveLater = null;
function sendMove() {

function walkToShop(id) { const d = DOOR3[id]; goDoor = id; me.target = { x: d.x, z: d.z }; sendMove(); toast(`${THEMES[id].name}(으)로 가는 중…`); }

let last = performance.now();
function frame(now) {
