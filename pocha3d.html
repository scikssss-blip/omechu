}
function leaveTable() { if (tch && sb) { try { sb.removeChannel(tch); } catch (e) {} } tch = null; }

// ═══ 앉기 / 일어나기 / 말하기 ═══
const taken = (t, s) => [...people.values()].some(p => p.t === t && p.s === s);
const freeSeat = (t) => { for (let s = 0; s < tables[t].cap; s++) if (!taken(t, s)) return s; return null; };
const seatedAt = (t) => [...people.values()].filter(p => p.t === t).length;
function sit(t, s) {
  if (taken(t, s)) { s = freeSeat(t); if (s === null) { toast('그 자리는 꽉 찼어요'); return; } }
  if (me.t !== null) leaveTable();
  putSeat(me, t, s); seatAt = Date.now(); joinTable(t); track();
  log.push({ sys: true, text: tables[t].solo ? TH.solo + '에 앉았어요. 소리를 켜고 천천히 쉬어가세요.' : `${tables[t].name}에 앉았어요. 대화는 같은 테이블 사람에게만 보여요.` });
  ui();
}
function stand() { if (me.t === null) return; unseat(me); leaveTable(); log = []; track(); ui(); }
function quick(soloZone) {
  let best = null, bn = -1;
  for (let t = 0; t < tables.length; t++) { if (!!tables[t].solo !== !!soloZone) continue; const n = seatedAt(t) - (me.t === t ? 1 : 0); if (n < tables[t].cap && n > bn) { bn = n; best = t; } }
  if (best === null) { toast('지금은 자리가 꽉 찼어요'); return; }
  const s = freeSeat(best); if (s !== null) sit(best, s);
}
function say() {
  const el = $('msg'); if (!el || me.t === null || tables[me.t].solo) return; const text = clean(el.value.trim()); if (!text) return;
  if (Date.now() - lastSend < 1500) { toast('조금만 천천히 말해 주세요'); return; } lastSend = Date.now(); el.value = '';
  if (tch) { tch.send({ type: 'broadcast', event: 'chat', payload: { sid: SID, text } }); if (ch) ch.send({ type: 'broadcast', event: 'talk', payload: { sid: SID } }); }
  else { log.push({ nick: myNick, text, mine: true }); bubble(me, text, '', 4200); ui(true); }
}
function emote(e) { if (Date.now() - lastSend < 1200) return; lastSend = Date.now(); bubble(me, e, 'emote', 2200); if (e === '🍻') clink(); if (ch) ch.send({ type: 'broadcast', event: 'emote', payload: { sid: SID, e } }); }

// ═══ 말풍선 (화면 위 글자) ═══
function bubble(p, text, cls, ms) {
  if (p.bubble) { p.bubble.el.remove(); clearTimeout(p.bubble.tm); }
  const el = document.createElement('div'); el.className = 'bubble ' + cls; el.textContent = text; $('bubbles').appendChild(el);
  p.bubble = { el, tm: setTimeout(() => { el.remove(); p.bubble = null; }, ms) };
}
const v3 = new THREE.Vector3();
function placeBubbles() { for (const p of [...people.values(), ...owners]) { if (!p.bubble) continue; v3.set(p.g.position.x, p.g.position.y + 2.05, p.g.position.z).project(camera); p.bubble.el.style.display = v3.z > 1 ? 'none' : ''; p.bubble.el.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px'; p.bubble.el.style.top = ((1 - v3.y) / 2 * innerHeight) + 'px'; } }

// ═══ 아래 패널 ═══
const toastEl = $('toast'); let toastT;
const toast = (m) => { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1900); };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const whereText = () => me.t === null ? '' : `${tables[me.t].name} · ${seatedAt(me.t)}/${tables[me.t].cap}명`;
let panelMode = '';
function ui(logOnly) {
  $('count').textContent = !sb ? '혼자 보기' : joined ? `👥 ${people.size}명` : '연결 중…';
  const mode = me.t === null ? 'walk' : tables[me.t].solo ? 'solo' : 'table:' + me.t;
  const logHTML = log.map(l => l.sys ? `<div class="sys">${esc(l.text)}</div>` : `<div class="${l.mine ? 'me' : ''}"><b>${esc(l.nick)}</b>${esc(l.text)}</div>`).join('');
  if (logOnly && mode === panelMode) { if ($('log')) { $('log').innerHTML = logHTML; $('log').scrollTop = 1e6; } if ($('where2')) $('where2').textContent = whereText(); return; }
  panelMode = mode; const P = $('panel');
  const emo = (xs, st = '') => `<div class="emo" ${st}>${xs.map(e => `<button data-e="${e}" aria-label="감정 표현 ${e}">${e}</button>`).join('')}</div>`;
  if (mode === 'walk') P.innerHTML = `<div class="where">테이블을 누르면 바로 앉아요 <small>· 대화는 앉아야 할 수 있어요</small></div><div class="row"><button class="btn hot" id="q1">🪑 바로 앉기</button><button class="btn" id="q2">${RID === 'pocha' ? '🍶' : '🍚'} ${TH.solo} 가기</button></div>${emo(EMOTES)}`;
  else if (mode === 'solo') P.innerHTML = `<div class="log" id="log">${logHTML}</div><div class="where">${RID === 'pocha' ? '🍶' : '🍚'} ${TH.solo} <small>· 대화 없이 빗소리와 가게 소리만 들려요</small></div><div class="row"><button class="btn" id="up">🚪 일어나기</button></div>`;
  else P.innerHTML = `<div class="log" id="log">${logHTML}</div><div class="where"><span id="where2">${whereText()}</span></div><div class="row"><input class="in" id="msg" maxlength="60" placeholder="우리 테이블에만 보여요" autocomplete="off" enterkeyhint="send"><button class="btn hot" id="go">전송</button></div><div class="row" style="margin-top:8px"><button class="btn" id="up">🚪 일어나기</button>${emo(EMOTES.concat('🍻'), 'style="margin:0"')}</div>`;
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on('q1', () => quick(false)); on('q2', () => quick(true)); on('up', stand); on('go', say);
  if ($('msg')) $('msg').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) say(); };
  P.querySelectorAll('[data-e]').forEach(b => b.onclick = () => emote(b.dataset.e));
  if ($('log')) $('log').scrollTop = 1e6;
}

// ═══ 소리 (모두 직접 합성): 빗소리 + 주방 지글지글 + 사람이 많을수록 커지는 왁자지껄 ═══
let au = null;
function soundOn() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), sr = ctx.sampleRate, len = sr * 4;
  const white = ctx.createBuffer(2, len, sr), brown = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) { const w = white.getChannelData(c), b = brown.getChannelData(c); let last = 0; for (let i = 0; i < len; i++) { const n = Math.random() * 2 - 1; w[i] = n; last = (last + 0.02 * n) / 1.02; b[i] = last * 3.5; } }
  const loop = (buf) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * 3); return s; };
  const out = ctx.createGain(); out.gain.value = 0; const comp = ctx.createDynamicsCompressor(); out.connect(comp).connect(ctx.destination); out.gain.setTargetAtTime(1, ctx.currentTime, 0.8);
  const filt = (type, f, q) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
  const gain = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  // 비: 천막 위로 떨어지는 소리
  const rainBus = filt('lowpass', TH.indoor ? 1300 : 4200, 0.3); rainBus.connect(gain(0.8)).connect(out);
  loop(white).connect(filt('highpass', 2200, 0.5)).connect(gain(0.05)).connect(rainBus);
  const body = gain(0.19); loop(white).connect(filt('bandpass', 620, 0.5)).connect(body).connect(rainBus);
  loop(brown).connect(filt('lowpass', 160, 0.7)).connect(gain(0.5)).connect(rainBus);
  const lfo = ctx.createOscillator(), lg = gain(0.04); lfo.frequency.value = 0.06; lfo.connect(lg).connect(body.gain); lfo.start();
  // 주방: 지글지글
  loop(white).connect(filt('highpass', 5200, 0.7)).connect(gain(0.012)).connect(out);
  // 왁자지껄: 목소리 12개를 미리 만들어 두고, 사람 수에 따라 켜는 개수와 크기를 바꿈
  const crowd = gain(0), crowdLP = filt('lowpass', 1700, 0.4); crowdLP.connect(crowd).connect(out);
  const voices = [];
  for (let i = 0; i < 12; i++) {
    const osc = ctx.createOscillator(); osc.type = 'sawtooth'; const f0 = 95 + Math.random() * 150; osc.frequency.value = f0; osc.start();
    const f1 = filt('bandpass', 500, 4), f2 = filt('bandpass', 1500, 5), mix = gain(0);
    osc.connect(f1); osc.connect(f2); loop(white).connect(gain(0.25)).connect(f1); f1.connect(mix); f2.connect(gain(0.45)).connect(mix);
    let dst = mix; if (ctx.createStereoPanner) { const pn = ctx.createStereoPanner(); pn.pan.value = Math.random() * 1.8 - 0.9; mix.connect(pn); dst = pn; }
    dst.connect(crowdLP); voices.push({ osc, f0, f1, f2, mix, talk: 0, rest: Math.random() * 3 });
  }
  au = { ctx, out, rainBus, crowd, voices, white, active: 0 };
  // 말소리 흉내: 0.14초마다 음절처럼 크기·입모양(포먼트)·높낮이를 바꿈. 한참 말하다 잠깐 쉼.
  au.timer = setInterval(() => {
    const t = ctx.currentTime;
    voices.forEach((v, i) => {
      if (i >= au.active) { v.mix.gain.setTargetAtTime(0, t, 0.1); return; }
      if (v.rest > 0) { v.rest -= 0.14; v.mix.gain.setTargetAtTime(0, t, 0.08); if (v.rest <= 0) v.talk = 0.8 + Math.random() * 2.6; return; }
      v.talk -= 0.14; if (v.talk <= 0) { v.rest = 0.3 + Math.random() * 2.2; return; }
      v.mix.gain.setTargetAtTime(Math.random() < 0.18 ? 0.02 : 0.35 + Math.random() * 0.65, t, 0.03);
      v.f1.frequency.setTargetAtTime(300 + Math.random() * 520, t, 0.04); v.f2.frequency.setTargetAtTime(900 + Math.random() * 1300, t, 0.04);
      v.osc.frequency.setTargetAtTime(v.f0 * (0.88 + Math.random() * 0.3), t, 0.05);
    });
    if (Math.random() < 0.004 * (1 + au.active)) clink(0.5);
  }, 140);
  // 천막에 떨어지는 빗방울
  const drop = () => { if (!au) return; const t = ctx.currentTime, s = ctx.createBufferSource(); s.buffer = white; const f = filt('bandpass', 900 + Math.random() * 2600, 5 + Math.random() * 6), g = gain(0.0001);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime((TH.indoor ? 0.035 : 0.09) * (0.4 + Math.random()), t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05 + Math.random() * 0.09);
    s.connect(f).connect(g).connect(rainBus); s.start(t, Math.random() * 3, 0.2); au.dropT = setTimeout(drop, (TH.indoor ? 160 : 40) + Math.random() * (TH.indoor ? 500 : 170)); };
  drop(); crowdTune();
}
function soundOff() { if (!au) return; clearInterval(au.timer); clearTimeout(au.dropT); const c = au.ctx; au.out.gain.setTargetAtTime(0, c.currentTime, 0.2); au = null; setTimeout(() => c.close().catch(() => {}), 800); }
// 사람 수 → 왁자지껄 크기. 혼자여도 옆 가게에서 넘어오는 정도는 깔림. 혼술존에서는 조금 멀게 들림.
function crowdTune() {
  if (!au) return; const n = Math.max(0, people.size - 1), t = au.ctx.currentTime, inSolo = me.t !== null && tables[me.t].solo;
  au.active = Math.min(12, 2 + n * 2);
  au.crowd.gain.setTargetAtTime(Math.min(0.5, 0.05 + n * 0.045) * (inSolo ? 0.6 : 1), t, 1.2);
  au.rainBus.frequency.setTargetAtTime(TH.indoor ? (inSolo ? 2800 : 1300) : (inSolo ? 6500 : 4200), t, 0.8);     // 창가는 빗소리가 더 또렷
}
function clink(v = 1) { if (!au) return; const c = au.ctx, t = c.currentTime; for (const f of [2100 + Math.random() * 500, 3300 + Math.random() * 700]) { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06 * v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(g).connect(au.out); o.start(t); o.stop(t + 0.55); } }
$('snd').onclick = () => { try { if (au) soundOff(); else soundOn(); } catch (e) { toast('이 기기에서는 소리를 낼 수 없어요'); } $('snd').textContent = au ? '🔊 소리 끄기' : '🔈 소리 켜기'; $('snd').classList.toggle('on', !!au); };
setInterval(crowdTune, 1500);

// ═══ 카메라·조작 ═══
const cam = { az: 0.3, pol: 0.9, dist: 17, tx: 0, tz: 2 };
function placeCamera() { const y = Math.cos(cam.pol) * cam.dist, r = Math.sin(cam.pol) * cam.dist; camera.position.set(cam.tx + Math.sin(cam.az) * r, 1 + y, cam.tz + Math.cos(cam.az) * r); camera.lookAt(cam.tx, 1, cam.tz); }
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 52 : 40; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const pts = new Map(); let moved = 0, pinch = 0;
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 1) moved = 0; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); moved = 99; } if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); });
cv.addEventListener('pointermove', (e) => {
  const p = pts.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 1) { moved += Math.abs(dx) + Math.abs(dy); if (moved > 8) { cam.az -= dx * 0.008; cam.pol = Math.min(1.4, Math.max(0.3, cam.pol - dy * 0.006)); } }
  else if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch) cam.dist = Math.min(32, Math.max(6, cam.dist * pinch / d)); pinch = d; }
});
cv.addEventListener('pointerup', (e) => { const had = pts.has(e.pointerId); pts.delete(e.pointerId); if (had && pts.size === 0 && moved <= 8) tap(e.clientX, e.clientY); });
cv.addEventListener('pointercancel', (e) => pts.delete(e.pointerId));
cv.addEventListener('wheel', (e) => { cam.dist = Math.min(32, Math.max(6, cam.dist * (1 + e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function tableAt(x, z) {
  for (let t = 0; t < tables.length; t++) { const tb = tables[t];
    if (tb.bar ? (Math.abs(x) < 5.2 && z < -4.1 && z > -6.8) : tb.solo ? (x > HW - 2.3 && x < HW + 0.4 && z > -7.8 && z < 6.4) : Math.hypot(x - tb.x, z - tb.z) < tb.r + 0.5) return t; }
  return null;
}
function tap(cx, cy) {
  ray.setFromCamera(new THREE.Vector2(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  if (!ray.ray.intersectPlane(plane, hit)) return; const x = hit.x, z = hit.z, t = tableAt(x, z);
  if (t !== null) {                                    // 테이블·의자 근처 → 누른 곳에서 가장 가까운 빈자리에 바로 앉기
    if (t === me.t) return; let best = null, bd = 1e9;
    for (const q of seats) { if (q.t !== t || taken(t, q.i)) continue; const d = Math.hypot(q.x - x, q.z - z); if (d < bd) { bd = d; best = q; } }
    if (!best) { toast('그 자리는 꽉 찼어요'); return; } sit(t, best.i); return;
  }
  if (Math.abs(x) > HW - 0.5 || z < -3.9 || z > HD + 4) return;
  if (me.t !== null) stand();
  me.target = { x, z };
  if (ch && joined && Date.now() - lastMove > 300) { lastMove = Date.now(); ch.send({ type: 'broadcast', event: 'move', payload: { sid: SID, x: +x.toFixed(2), z: +z.toFixed(2) } }); }
}
function avoid(p) { for (const tb of tables) { if (tb.bar || tb.solo) continue; const dx = p.x - tb.x, dz = p.z - tb.z, d = Math.hypot(dx, dz), min = 1.55; if (d < min && d > 0.001) { p.x = tb.x + dx / d * min; p.z = tb.z + dz / d * min; } } p.z = Math.max(-3.9, p.z); p.x = Math.min(HW - 2.3, Math.max(-HW + 0.6, p.x)); }

// ═══ 매 프레임 ═══
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const T = now / 1000;
  for (const p of people.values()) {
    let walking = false;
    if (p.target && p.t === null) { const q = p.g.position, dx = p.target.x - q.x, dz = p.target.z - q.z, d = Math.hypot(dx, dz);
      if (d < 0.08) { p.target = null; if (p.mine) track(); } else { walking = true; const st = Math.min(d, 4.2 * dt), ox = q.x, oz = q.z; q.x += dx / d * st; q.z += dz / d * st; avoid(q); if (Math.hypot(q.x - ox, q.z - oz) < st * 0.2) { p.target = null; if (p.mine) track(); } p.sp.scale.x = (dx * Math.cos(cam.az) - dz * Math.sin(cam.az)) < 0 ? -1.5 : 1.5; } }
    p.sp.position.y = walking ? Math.abs(Math.sin(T * 9 + p.ph)) * 0.16 : Math.sin(T * 2 + p.ph) * 0.035;
    p.sp.scale.y = 1.5 * (1 + (walking ? 0 : Math.sin(T * 2 + p.ph) * 0.025));
  }
  for (const o of owners) { o.g.position.x = o.home + Math.sin(T * 0.35 + o.ph) * 1.1; o.sp.position.y = Math.abs(Math.sin(T * 3 + o.ph)) * 0.05; }
  cam.tx += (me.g.position.x * 0.8 - cam.tx) * Math.min(1, dt * 3); cam.tz += ((me.g.position.z * 0.75 + 0.3) - cam.tz) * Math.min(1, dt * 3);
  for (const l of lanterns) { const f = 0.88 + Math.sin(T * 5.3 + l.ph) * 0.06 + Math.sin(T * 13.1 + l.ph * 2) * 0.04; if (l.L) l.L.intensity = l.base * f; l.glow.material.opacity = 0.5 * f; }
  for (const s of steams) { const k = (T * 0.35 + s.ph) % 1; s.s.position.set(s.x + Math.sin(k * 6 + s.ph * 9) * 0.15, 1.35 + k * 1.5, s.z); const sc = 0.5 + k * 1.1; s.s.scale.set(sc, sc, 1); s.s.material.opacity = Math.sin(k * Math.PI) * 0.22; }
  for (let i = 0; i < RN; i++) { const o = i * 6; rainPos[o + 1] -= rainV[i] * dt; rainPos[o + 4] -= rainV[i] * dt; if (rainPos[o + 4] < 0) rainReset(i, true); }
  rainGeo.attributes.position.needsUpdate = true;
  placeCamera(); renderer.render(scene, camera); placeBubbles();
  requestAnimationFrame(frame);
}
ui(); connect(); requestAnimationFrame(frame);
addEventListener('pagehide', () => { try { if (ch) ch.untrack(); if (lobby) lobby.untrack(); } catch (e) {} });
$('title').textContent = TH.name;
window.__p3d = { cam, me, people, seats, tables, tap, sit, stand, quick, say, soundOn, SID, get au() { return au; }, get log() { return log; } };
</script>
</body>
