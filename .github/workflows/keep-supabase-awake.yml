name: Supabase 깨우기

# Supabase 무료 플랜은 7일 동안 요청이 없으면 멈춘다 → 3일마다 한 번 가볍게 조회
on:
  schedule:
    - cron: "17 3 */3 * *"   # 3일마다 03:17 UTC (한국 12:17)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: posts 1건 조회
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://arodifxcwdehcezybhrh.supabase.co/rest/v1/posts?select=id&limit=1" \
            -H "apikey: sb_publishable_fHCAe5O2yY_EPtZhdGPyJg_cHPkjgiB" \
            -H "Authorization: Bearer sb_publishable_fHCAe5O2yY_EPtZhdGPyJg_cHPkjgiB")
          echo "status=$code"
          test "$code" = "200"
