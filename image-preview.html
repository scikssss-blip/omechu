<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오메추 이미지 설정</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#f0f0f0; font-family:'Apple SD Gothic Neo',sans-serif; padding:16px 16px 80px; }
h1 { font-size:18px; margin-bottom:4px; color:#ff4757; }
.desc { font-size:12px; color:#888; margin-bottom:4px; line-height:1.7; }
.safe-badge { display:inline-block; background:rgba(6,214,160,0.15); border:1px solid #06d6a0; border-radius:20px; padding:3px 10px; font-size:11px; color:#06d6a0; margin-bottom:12px; }
.stats { font-size:12px; color:#ff4757; font-weight:700; margin-bottom:12px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.card { background:#1e1e1e; border-radius:12px; overflow:hidden; border:2px solid #333; cursor:pointer; transition:all 0.15s; }
.card:hover { border-color:#666; transform:translateY(-1px); }
.card.has-img { border-color:#06d6a0; }
.card img { width:100%; height:110px; object-fit:cover; display:block; }
.card .no-img { width:100%; height:110px; background:#2a2a2a; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; }
.card .no-img .emoji { font-size:28px; }
.card .no-img .label { font-size:10px; color:#555; }
.card .info { padding:8px; }
.card .name { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .del-btn { margin-top:6px; width:100%; background:#2a2a2a; border:1px solid #ff4757; border-radius:6px; color:#ff4757; font-size:10px; padding:4px; cursor:pointer; display:none; }
.card.has-img .del-btn { display:block; }
.bottom-bar { position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; border-top:1px solid #333; padding:10px 16px; display:flex; gap:8px; align-items:center; }
.bottom-bar button { background:#ff4757; border:none; border-radius:8px; color:white; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
.bottom-bar .count { font-size:12px; color:#888; flex:1; }
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:200; flex-direction:column; }
.modal-bg.open { display:flex; }
.modal-header { background:#1e1e1e; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #333; flex-shrink:0; }
.modal-header h3 { font-size:15px; color:#ff4757; }
.modal-header .close-btn { background:#333; border:none; border-radius:20px; color:#aaa; padding:6px 14px; font-size:12px; cursor:pointer; }
.search-bar { background:#1a1a1a; padding:10px 16px; display:flex; gap:8px; flex-shrink:0; border-bottom:1px solid #222; }
.search-bar input { flex:1; background:#2a2a2a; border:1.5px solid #444; border-radius:10px; padding:9px 14px; font-size:13px; color:#f0f0f0; outline:none; }
.search-bar input:focus { border-color:#ff4757; }
.search-bar button { background:#ff4757; border:none; border-radius:10px; color:white; padding:9px 16px; font-size:13px; cursor:pointer; white-space:nowrap; }
.img-grid { flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; align-content:start; }
.img-item { border-radius:10px; overflow:hidden; cursor:pointer; border:2px solid transparent; transition:all 0.15s; aspect-ratio:4/3; background:#2a2a2a; }
.img-item:hover { border-color:#ff4757; transform:scale(1.02); }
.img-item img { width:100%; height:100%; object-fit:cover; display:block; }
.site-tab { background:#2a2a2a; border:1.5px solid #444; border-bottom:none; border-radius:8px 8px 0 0; color:#888; font-size:12px; padding:7px 14px; cursor:pointer; font-family:'Apple SD Gothic Neo',sans-serif; transition:all 0.15s; }
.site-tab.active { background:#1e1e1e; border-color:#ff4757; color:#ff4757; }
.ext-grid { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.ext-open-btn { width:100%; max-width:360px; padding:14px; border-radius:14px; border:2px solid; font-size:14px; font-weight:700; cursor:pointer; font-family:'Apple SD Gothic Neo',sans-serif; transition:all 0.2s; }
.ext-hint { font-size:12px; color:#666; text-align:center; line-height:1.8; max-width:320px; }
.done-modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:300; align-items:flex-end; justify-content:center; }
.done-modal-bg.open { display:flex; }
.done-modal { background:#1e1e1e; border-radius:20px 20px 0 0; padding:20px; width:100%; max-width:480px; }
.done-modal h3 { font-size:15px; margin-bottom:8px; color:#06d6a0; }
.done-modal textarea { width:100%; height:180px; background:#111; border:1px solid #444; border-radius:8px; padding:10px; font-size:11px; color:#ccc; font-family:monospace; resize:none; margin-bottom:8px; }
.done-modal .btn-row { display:flex; gap:8px; }
.done-modal .btn-row button { flex:1; padding:12px; border-radius:10px; border:none; font-size:13px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<h1>🍽️ 오메추 이미지 설정</h1>
<div class="desc">카드 클릭 → Pexels 이미지 자동 검색 → 마음에 드는 거 클릭 → 저장!</div>
<div class="safe-badge">✅ Pexels — 상업적 무료 사용 가능</div>
<div class="stats" id="stats">설정된 이미지: 0 / 250개</div>
<div class="grid" id="grid"></div>

<div class="bottom-bar">
  <span class="count" id="export-count">0개 설정됨</span>
  <button onclick="showDone()">📋 코드 내보내기</button>
  <button onclick="clearAll()" style="background:#333;color:#aaa;">초기화</button>
</div>

<div class="modal-bg" id="modal">
  <div class="modal-header">
    <h3 id="modal-title">이미지 선택</h3>
    <button class="close-btn" onclick="closeModal()">✕ 닫기</button>
  </div>
  <div style="background:#161616;padding:8px 16px 0;border-bottom:1px solid #222;flex-shrink:0;display:flex;gap:6px">
    <button id="tab-wikipedia" class="site-tab" onclick="switchTab('wikipedia')">Wikipedia</button>
    <button id="tab-pexels" class="site-tab active" onclick="switchTab('pexels')">Pexels</button>
    <button id="tab-unsplash" class="site-tab" onclick="switchTab('unsplash')">Unsplash</button>
    <button id="tab-pixabay" class="site-tab" onclick="switchTab('pixabay')">Pixabay</button>
  </div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="검색어 수정 가능" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">검색</button>
  </div>
  <div style="background:#1a1a1a;padding:8px 16px;border-bottom:1px solid #222;display:flex;gap:8px;align-items:center;flex-shrink:0">
    <input type="text" id="direct-url" placeholder="또는 이미지 URL 직접 붙여넣기" 
      style="flex:1;background:#2a2a2a;border:1.5px solid #555;border-radius:8px;padding:7px 12px;font-size:12px;color:#f0f0f0;outline:none"
      onkeydown="if(event.key==='Enter')saveDirectUrl()"
      onfocus="this.style.borderColor='#ff4757'" onblur="this.style.borderColor='#555'">
    <button onclick="saveDirectUrl()" style="background:#ff4757;border:none;border-radius:8px;color:white;padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap">URL저장</button>
  </div>
  <div class="img-grid" id="img-grid">
    <div class="loading">카드를 클릭하면 이미지가 표시돼요</div>
  </div>
</div>

<div class="done-modal-bg" id="done-modal" onclick="if(event.target===this)closeDone()">
  <div class="done-modal">
    <h3>✅ 저에게 이걸 붙여넣어주세요!</h3>
    <textarea id="done-code" readonly></textarea>
    <div class="btn-row">
      <button onclick="copyDone()" style="background:#ff4757;color:white;">📋 복사</button>
      <button onclick="closeDone()" style="background:#333;color:#aaa;">닫기</button>
    </div>
  </div>
</div>

let currentMenu = null;

function updateStats() {
  const count = Object.keys(imgMap).length;
  document.getElementById('stats').textContent = `설정된 이미지: ${count} / ${MENUS.length}개`;
  document.getElementById('export-count').textContent = `${count}개 설정됨`;
}

function renderCard(name, i) {
  const url = imgMap[name];
  const card = document.createElement('div');
  card.className = 'card' + (url ? ' has-img' : '');
  card.id = `card-${i}`;
  card.onclick = () => openModal(name);
  const imgHtml = url
    ? `<img src="${url}" alt="${name}" onerror="this.style.display='none'">`
    : `<div class="no-img"><span class="emoji">🍽️</span><span class="label">클릭해서 선택</span></div>`;
  card.innerHTML = `${imgHtml}
    <div class="info">
      <div class="name">${name}</div>
      ${url ? `<button class="del-btn" onclick="event.stopPropagation();deleteImg('${name.replace(/'/g,"\\'")}',${i})">✕ 삭제</button>` : ''}
    </div>`;
  return card;
}

function init() {
  const grid = document.getElementById('grid');
  MENUS.forEach((name, i) => grid.appendChild(renderCard(name, i)));
  updateStats();
}

let currentTab = 'pexels';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.site-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  const grid = document.getElementById('img-grid');
  grid.style.cssText = 'display:grid;flex-direction:initial;align-items:initial;padding:12px;gap:8px;';
  const kw = document.getElementById('search-input').value.trim();
  searchImages(kw, tab);
}

async function openModal(name) {
  currentMenu = name;
  currentTab = 'wikipedia';
  document.querySelectorAll('.site-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-wikipedia').classList.add('active');
  document.getElementById('modal-title').textContent = `🖼️ ${name}`;
  const wikiKw = MENU_WIKI[name] || EN_KW[name] || name;
  document.getElementById('search-input').value = wikiKw;
  document.getElementById('direct-url').value = '';
  document.getElementById('img-grid').style.cssText = 'display:grid;padding:12px;gap:8px;';
  document.getElementById('modal').classList.add('open');
  await searchImages(wikiKw, 'wikipedia');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  currentMenu = null;
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  await searchImages(q, currentTab);
}

async function searchImages(query, site = 'pexels') {
  const grid = document.getElementById('img-grid');
  grid.innerHTML = '<div class="loading">🔍 검색 중...</div>';
  try {
    const res = await fetch(`/api/pexels?query=${encodeURIComponent(query)}&site=${site}`);
    const data = await res.json();
    if (!data.photos || data.photos.length === 0) {
      grid.innerHTML = `<div class="loading">이미지를 찾지 못했어요 😢<br>검색어를 바꿔보세요</div>`;
      return;
    }
    grid.innerHTML = '';
    data.photos.forEach(photo => {
      const div = document.createElement('div');
      div.className = 'img-item';
      div.innerHTML = `<img src="${photo.src.medium}" loading="lazy">`;
      div.onclick = () => selectImg(photo.src.large);
      grid.appendChild(div);
    });
  } catch(e) {
    grid.innerHTML = `<div class="loading">오류가 발생했어요 😢</div>`;
  }
}

function saveDirectUrl() {
  const url = document.getElementById('direct-url').value.trim();
  if (!url || !url.startsWith('http')) { alert('올바른 URL을 입력해주세요'); return; }
  if (!currentMenu) return;
  selectImg(url);
  document.getElementById('direct-url').value = '';
}

function selectImg(url) {
  if (!currentMenu) return;
  imgMap[currentMenu] = url;
  localStorage.setItem('omechuImgMap', JSON.stringify(imgMap));
  const idx = MENUS.indexOf(currentMenu);
  document.getElementById(`card-${idx}`).replaceWith(renderCard(currentMenu, idx));
  updateStats();
  closeModal();
}

function deleteImg(name, i) {
  delete imgMap[name];
  localStorage.setItem('omechuImgMap', JSON.stringify(imgMap));
  document.getElementById(`card-${i}`).replaceWith(renderCard(name, i));
  updateStats();
}

function showDone() {
  const lines = Object.entries(imgMap).map(([k,v]) => `  '${k}':'${v}'`).join(',\n');
  document.getElementById('done-code').value = lines || '(아직 없어요)';
  document.getElementById('done-modal').classList.add('open');
}

function closeDone() {
  document.getElementById('done-modal').classList.remove('open');
}

function copyDone() {
  navigator.clipboard.writeText(document.getElementById('done-code').value)
    .then(() => alert('복사됐어요! 저에게 붙여넣어주세요.'));
}

function clearAll() {
  if (!confirm('전체 초기화할까요?')) return;
  imgMap = {};
  localStorage.removeItem('omechuImgMap');
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  MENUS.forEach((name, i) => grid.appendChild(renderCard(name, i)));
  updateStats();
}

init();
</script>
