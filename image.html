<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오메추 이미지 설정</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#f0f0f0; font-family:'Apple SD Gothic Neo',sans-serif; padding:16px 16px 80px; }
h1 { font-size:18px; margin-bottom:4px; color:#ff4757; }
.desc { font-size:12px; color:#888; margin-bottom:4px; line-height:1.7; }
.safe-badge { display:inline-block; background:rgba(6,214,160,0.15); border:1px solid #06d6a0; border-radius:20px; padding:3px 10px; font-size:11px; color:#06d6a0; margin-bottom:12px; }
.stats { font-size:12px; color:#ff4757; font-weight:700; margin-bottom:12px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.card { background:#1e1e1e; border-radius:12px; overflow:hidden; border:2px solid #333; transition:all 0.15s; }
.card.has-img { border-color:#06d6a0; }
.card img { width:100%; height:110px; object-fit:cover; display:block; }
.card .no-img { width:100%; height:110px; background:#2a2a2a; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; }
.card .no-img .emoji { font-size:28px; }
.card .no-img .label { font-size:10px; color:#555; }
.card .info { padding:8px; }
.card .name { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
.card .actions { display:flex; gap:4px; }
.card .actions button { flex:1; background:#2a2a2a; border:1px solid #444; border-radius:6px; color:#aaa; font-size:10px; padding:5px 2px; cursor:pointer; font-family:'Apple SD Gothic Neo',sans-serif; transition:all 0.15s; }
.card .actions .uns-btn { border-color:#06d6a0; color:#06d6a0; }
.card .actions .uns-btn:hover { background:#0a2a20; }
.card .actions .pex-btn { border-color:#4a9eff; color:#4a9eff; }
.card .actions .pex-btn:hover { background:#0a1a3a; }
.card .actions .del-btn { flex:0; padding:5px 6px; border-color:#ff4757; color:#ff4757; }
.card .actions .del-btn:hover { background:#3a1a1a; }
.bottom-bar { position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; border-top:1px solid #333; padding:10px 16px; display:flex; gap:8px; align-items:center; }
.bottom-bar button { background:#ff4757; border:none; border-radius:8px; color:white; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
.bottom-bar .count { font-size:12px; color:#888; flex:1; }

/* 모달 */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; align-items:flex-end; justify-content:center; }
.modal-bg.open { display:flex; }
.modal { background:#1e1e1e; border-radius:20px 20px 0 0; padding:20px; width:100%; max-width:480px; }
.modal h3 { font-size:15px; margin-bottom:6px; color:#ff4757; }
.modal .hint { font-size:11px; color:#666; margin-bottom:12px; line-height:1.6; }
.modal .hint a { color:#06d6a0; }
.modal input { width:100%; background:#111; border:1.5px solid #444; border-radius:10px; padding:11px 14px; font-size:13px; color:#f0f0f0; outline:none; margin-bottom:8px; }
.modal input:focus { border-color:#ff4757; }
.modal .preview-wrap { width:100%; height:150px; border-radius:10px; overflow:hidden; background:#2a2a2a; margin-bottom:8px; display:flex; align-items:center; justify-content:center; }
.modal .preview-wrap img { width:100%; height:100%; object-fit:cover; display:none; }
.modal .preview-wrap .ph { font-size:11px; color:#555; }
.modal .modal-btns { display:flex; gap:8px; }
.modal .modal-btns button { flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer; font-family:'Apple SD Gothic Neo',sans-serif; }
.modal .cancel-btn { background:#333; color:#aaa; }
.modal .save-btn { background:#ff4757; color:white; }

/* 완료 모달 */
.done-modal { background:#1e1e1e; border-radius:20px; padding:24px; width:100%; max-width:480px; }
.done-modal h3 { font-size:15px; margin-bottom:8px; color:#06d6a0; }
.done-modal textarea { width:100%; height:160px; background:#111; border:1px solid #444; border-radius:8px; padding:10px; font-size:11px; color:#ccc; font-family:monospace; resize:none; margin-bottom:8px; }
.done-modal button { width:100%; padding:12px; background:#ff4757; border:none; border-radius:10px; color:white; font-size:14px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<h1>🍽️ 오메추 이미지 설정</h1>
<div class="desc">Unsplash / Pexels 에서 무료 상업용 이미지를 찾아 URL을 붙여넣으세요.</div>
<div class="safe-badge">✅ Unsplash · Pexels — 상업적 무료 사용 가능</div>
<div class="stats" id="stats">설정된 이미지: 0 / 250개</div>
<div class="grid" id="grid"></div>

<div class="bottom-bar">
  <span class="count" id="export-count">0개 설정됨</span>
  <button onclick="showDone()">📋 코드 내보내기</button>
  <button onclick="clearAll()" style="background:#333;color:#aaa;">초기화</button>
</div>

<!-- URL 입력 모달 -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title">이미지 URL 입력</h3>
    <div class="hint" id="modal-hint"></div>
    <input type="text" id="url-input" placeholder="이미지 URL 붙여넣기 (https://...)" oninput="previewImg(this.value)">
    <div class="preview-wrap">
      <img id="preview-img" alt="미리보기">
      <span class="ph" id="preview-ph">URL 입력하면 미리보기</span>
    </div>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="closeModal()">취소</button>
      <button class="save-btn" onclick="saveUrl()">저장</button>
    </div>
  </div>
</div>

<!-- 완료/내보내기 모달 -->
<div class="modal-bg" id="done-modal" onclick="if(event.target===this)closeDone()">
  <div class="done-modal">
    <h3>✅ 이미지 코드 — 저에게 붙여넣어주세요!</h3>
    <textarea id="done-code" readonly></textarea>
    <button onclick="copyDone()">📋 복사하기</button>
    <button onclick="closeDone()" style="background:#333;color:#aaa;margin-top:8px;">닫기</button>
  </div>
</div>

let imgMap = JSON.parse(localStorage.getItem('omechuImgMap') || '{}');
let currentMenu = null;

function updateStats() {
  const count = Object.keys(imgMap).length;
  document.getElementById('stats').textContent = `설정된 이미지: ${count} / ${MENUS.length}개`;
  document.getElementById('export-count').textContent = `${count}개 설정됨`;
}

function renderCard(name, i) {
  const url = imgMap[name];
  const kw = EN_KW[name] || name;
  const card = document.createElement('div');
  card.className = 'card' + (url ? ' has-img' : '');
  card.id = `card-${i}`;
  const imgHtml = url
    ? `<img src="${url}" alt="${name}" onerror="this.outerHTML='<div class=no-img><span class=emoji>🍽️</span><span class=label>로드실패</span></div>'">`
    : `<div class="no-img"><span class="emoji">🍽️</span><span class="label">없음</span></div>`;
  card.innerHTML = `
    ${imgHtml}
    <div class="info">
      <div class="name">${name}</div>
      <div class="actions">
        <button class="uns-btn" onclick="openUnsplash('${kw.replace(/'/g,"\\'")}')">Unsplash</button>
        <button class="pex-btn" onclick="openPexels('${kw.replace(/'/g,"\\'")}')">Pexels</button>
        <button class="url-btn" style="border-color:#aaa;color:#aaa" onclick="openModal('${name.replace(/'/g,"\\'")}')">URL</button>
        ${url ? `<button class="del-btn" onclick="deleteImg('${name.replace(/'/g,"\\'")}',${i})">✕</button>` : ''}
      </div>
    </div>`;
  return card;
}

function init() {
  const grid = document.getElementById('grid');
  MENUS.forEach((name, i) => grid.appendChild(renderCard(name, i)));
  updateStats();
}

function openUnsplash(kw) {
  window.open(`https://unsplash.com/s/photos/${encodeURIComponent(kw)}`, '_blank');
}

function openPexels(kw) {
  window.open(`https://www.pexels.com/search/${encodeURIComponent(kw)}/`, '_blank');
}

function openModal(name) {
  currentMenu = name;
  const kw = EN_KW[name] || name;
  document.getElementById('modal-title').textContent = `🖼️ ${name}`;
  document.getElementById('modal-hint').innerHTML =
    `이미지 찾기: <a href="https://unsplash.com/s/photos/${encodeURIComponent(kw)}" target="_blank">Unsplash ↗</a> &nbsp;|&nbsp; <a href="https://www.pexels.com/search/${encodeURIComponent(kw)}/" target="_blank">Pexels ↗</a><br>
    이미지에서 우클릭 → <strong>"이미지 주소 복사"</strong> 후 아래 붙여넣기`;
  document.getElementById('url-input').value = imgMap[name] || '';
  previewImg(imgMap[name] || '');
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('url-input').focus(), 100);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  currentMenu = null;
}

function previewImg(url) {
  const img = document.getElementById('preview-img');
  const ph = document.getElementById('preview-ph');
  if (url && url.startsWith('http')) {
    img.src = url;
    img.style.display = 'block';
    ph.style.display = 'none';
  } else {
    img.style.display = 'none';
    ph.style.display = 'block';
  }
}

function saveUrl() {
  const url = document.getElementById('url-input').value.trim();
  if (!url || !currentMenu) { alert('URL을 입력해주세요'); return; }
  imgMap[currentMenu] = url;
  localStorage.setItem('omechuImgMap', JSON.stringify(imgMap));
  const idx = MENUS.indexOf(currentMenu);
  document.getElementById(`card-${idx}`).replaceWith(renderCard(currentMenu, idx));
  updateStats();
  closeModal();
}

function deleteImg(name, i) {
  delete imgMap[name];
  localStorage.setItem('omechuImgMap', JSON.stringify(imgMap));
  document.getElementById(`card-${i}`).replaceWith(renderCard(name, i));
  updateStats();
}

function showDone() {
  const lines = Object.entries(imgMap).map(([k,v]) => `  '${k}':'${v}'`).join(',\n');
  document.getElementById('done-code').value = lines || '(아직 없어요)';
  document.getElementById('done-modal').classList.add('open');
}

function closeDone() {
  document.getElementById('done-modal').classList.remove('open');
}

function copyDone() {
  const text = document.getElementById('done-code').value;
  navigator.clipboard.writeText(text).then(() => alert('복사됐어요! 저에게 붙여넣어주세요.'));
}

function clearAll() {
  if (!confirm('전체 초기화할까요?')) return;
  imgMap = {};
  localStorage.removeItem('omechuImgMap');
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  MENUS.forEach((name, i) => grid.appendChild(renderCard(name, i)));
  updateStats();
}

document.getElementById('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveUrl(); });

init();
</script>
